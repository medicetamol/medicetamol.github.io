<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />

    <!-- Warm the connections to origins the deferred Firebase Auth + Firestore
         calls will hit right after first paint, so those cross-origin TLS
         handshakes aren't paid serially, one discovered after another. -->
    <link rel="preconnect" href="https://medicetamol-pyq.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <title>mediCetamol</title>
    <meta
      name="description"
      content="mediCetamol: Practice real PYQs for Medical PG Entrance. Subject-wise previous year questions with explanations, custom modules and progress tracking."
    />
    <link rel="canonical" href="https://medicetamol.github.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mediCetamol" />
    <meta property="og:title" content="mediCetamol" />
    <meta
      property="og:description"
      content="mediCetamol: Practice real PYQs for Medical PG Entrance. Subject-wise previous year questions with explanations, custom modules and progress tracking."
    />
    <meta property="og:url" content="https://medicetamol.github.io/" />
    <meta property="og:image" content="https://medicetamol.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="mediCetamol" />
    <meta
      name="twitter:description"
      content="mediCetamol: Practice real PYQs for Medical PG Entrance. Subject-wise previous year questions with explanations, custom modules and progress tracking."
    />
    <meta name="twitter:image" content="https://medicetamol.github.io/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/logo.png" sizes="192x192" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mediCetamol" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Apply the saved theme and text size before first paint (avoids a flash of the
         wrong look). Keys must match THEME_STORAGE_KEY in src/lib/theme.ts and
         FONT_SCALE_STORAGE_KEY in src/lib/fontScale.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("medicetamol-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f1f5f9");
          }
        } catch (e) {}
        try {
          var accent = localStorage.getItem("medicetamol-accent");
          var tints = { orange: "#17110d", indigo: "#0d0f1c", rose: "#140c10", amber: "#130f09" };
          if (accent && /^(lime|orange|indigo|rose|amber)$/.test(accent)) {
            document.documentElement.setAttribute("data-accent", accent);
            if (tints[accent] && localStorage.getItem("medicetamol-theme") !== "light") {
              var mt = document.querySelector('meta[name="theme-color"]');
              if (mt) mt.setAttribute("content", tints[accent]);
            }
          }
        } catch (e) {}
        try {
          var scale = localStorage.getItem("medicetamol-font-scale");
          if (scale === "small" || scale === "large") {
            document.documentElement.setAttribute("data-font-scale", scale);
            document.documentElement.style.fontSize = scale === "small" ? "87.5%" : "112.5%";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Inline (no network request) so this paints immediately, before the JS
         bundle has even started downloading. React replaces #root's contents
         on mount, so this disappears on its own — no cleanup code needed. -->
    <style>
      html { background: #0b0f14; }
      html[data-theme="light"] { background: #f1f5f9; }
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0f14;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      [data-theme="light"] .boot-loader {
        background: #f1f5f9;
        color: #0f172a;
      }
      .boot-loader__spinner {
        width: 168px;
        height: 168px;
        color: #2dd4bf;
      }
      [data-theme="light"] .boot-loader__spinner { color: #0d9488; }
      html[data-accent="lime"] .boot-loader__spinner { color: #c6f432; }
      html[data-accent="orange"] .boot-loader__spinner { color: #ff8a4c; }
      html[data-accent="indigo"] .boot-loader__spinner { color: #818cf8; }
      html[data-accent="rose"] .boot-loader__spinner { color: #fb7185; }
      html[data-accent="amber"] .boot-loader__spinner { color: #fbbf24; }
      html[data-theme="light"][data-accent="lime"] .boot-loader__spinner { color: #65a30d; }
      html[data-theme="light"][data-accent="orange"] .boot-loader__spinner { color: #ea580c; }
      html[data-theme="light"][data-accent="indigo"] .boot-loader__spinner { color: #4f46e5; }
      html[data-theme="light"][data-accent="rose"] .boot-loader__spinner { color: #e11d48; }
      html[data-theme="light"][data-accent="amber"] .boot-loader__spinner { color: #d97706; }
      html[data-accent="orange"]:not([data-theme="light"]), html[data-accent="orange"]:not([data-theme="light"]) .boot-loader { background: #17110d; }
      html[data-accent="indigo"]:not([data-theme="light"]), html[data-accent="indigo"]:not([data-theme="light"]) .boot-loader { background: #0d0f1c; }
      html[data-accent="rose"]:not([data-theme="light"]), html[data-accent="rose"]:not([data-theme="light"]) .boot-loader { background: #140c10; }
      html[data-accent="amber"]:not([data-theme="light"]), html[data-accent="amber"]:not([data-theme="light"]) .boot-loader { background: #130f09; }
      .boot-loader__ring {
        transform-origin: 50% 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__ring { animation-duration: 2.4s; }
      }
      .boot-loader__text {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.09em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <svg class="boot-loader__spinner" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bootRingGrad"><stop offset="0%" stop-color="currentColor" stop-opacity="1"/><stop offset="100%" stop-color="currentColor" stop-opacity="0.25"/></linearGradient></defs><path d="M45,71 C36,71 27,66 25,55 C24,46 27,34 35,27 L50,53 L65,27 C73,34 76,46 75,55 C73,66 64,71 55,71" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle class="boot-loader__ring" cx="50" cy="50" r="40" fill="none" stroke="url(#bootRingGrad)" stroke-width="2.5"/></svg>
        <div class="boot-loader__text">mediCetamol</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
