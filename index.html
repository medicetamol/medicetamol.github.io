      name="description"
      content="Practice real Previous Year Questions for NEET PG, INI-CET and FMGE. Subject-wise and topic-wise PYQs with explanations, bookmarks and progress tracking — free, distraction-free medical exam prep."
    />
    <link rel="canonical" href="https://medicetamol.github.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mediCetamol" />

      property="og:description"
      content="Practice real Previous Year Questions for NEET PG, INI-CET and FMGE, with explanations, bookmarks and progress tracking."
    />
    <meta property="og:url" content="https://medicetamol.github.io/" />
    <meta property="og:image" content="https://medicetamol.github.io/logo.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="mediCetamol — NEET PG, INI-CET & FMGE PYQs" />
    <meta
      name="twitter:description"
      content="Practice real Previous Year Questions for NEET PG, INI-CET and FMGE, with explanations, bookmarks and progress tracking."

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="mediCetamol" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Apply the saved theme before first paint (avoids a dark → light flash).
         Key must match THEME_STORAGE_KEY in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("medicetamol-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f1f5f9");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
