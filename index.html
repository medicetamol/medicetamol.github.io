    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Apply the saved theme and text size before first paint (avoids a flash of the
         wrong look). Keys must match THEME_STORAGE_KEY in src/lib/theme.ts and
         FONT_SCALE_STORAGE_KEY in src/lib/fontScale.ts. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("medicetamol-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f1f5f9");
          }
        } catch (e) {}
        try {
          var scale = localStorage.getItem("medicetamol-font-scale");
          if (scale === "small" || scale === "large") {
            document.documentElement.setAttribute("data-font-scale", scale);
            document.documentElement.style.fontSize = scale === "small" ? "87.5%" : "112.5%";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
